services:
  cli-proxy-api:
    image: ${CPA_IMAGE:-eceasy/cli-proxy-api:v8.0.44}
    container_name: codearts-cpa
    ports:
      - "8317:8317"
      - "18080:18080"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./panel:/CLIProxyAPI/panel:ro
      - ../../plugins:/CLIProxyAPI/plugins:ro
    environment:
      TZ: Asia/Shanghai
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/panel
    restart: "no"
