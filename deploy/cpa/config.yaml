config-version: 8

server:
  host: ""
  port: 8317

access:
  api-keys:
    - "codearts-test-key"

management:
  allow-remote: true
  secret-key: "codearts-mgmt-key"
  disable-control-panel: false
  disable-auto-update-panel: true

oauth:
  auth-dir: "/root/.cli-proxy-api"

observability:
  logs:
    debug: true

plugins:
  enabled: true
  dir: "plugins"
  configs:
    codearts:
      enabled: true
      priority: 1
      oauth_callback_host: "0.0.0.0"
      oauth_callback_port: 18080
      oauth_callback_path: "/oauth/callback"
      benefit_auto_claim: true
